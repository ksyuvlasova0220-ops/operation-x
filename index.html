<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPERATION: X — терминал</title>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,700;1,500&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#0c0a0b;--panel:#161214;--wine:#4a0d1a;--red:#d1222f;--silver:#c9c7cc;--mute:#9a9599;--line:#2e2629;--ok:#7fd1a0}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:radial-gradient(120% 80% at 50% 0%,#3a0a14,var(--bg) 60%);color:#f3f0f1;font:16px/1.5 Manrope,system-ui,sans-serif;display:grid;place-items:center;padding:24px}
.box{width:100%;max-width:440px;text-align:center}
.seal{width:88px;height:88px;margin:0 auto 22px;border-radius:50%;background:radial-gradient(circle at 38% 32%,#ff4b55,#b3101d 55%,#5c0610);display:grid;place-items:center;font:700 44px "Cormorant Garamond",serif;color:#ffd9dc;box-shadow:0 10px 30px rgba(0,0,0,.5)}
.file{color:var(--mute);font-size:14px;margin:0 0 8px}
h1{font:700 clamp(34px,8vw,46px)/1.05 "Cormorant Garamond",Georgia,serif;margin:0 0 10px}
p.sub{color:#cfc8cb;margin:0 0 26px}
form{display:flex;flex-direction:column;gap:12px}
input{width:100%;height:56px;border-radius:14px;border:1px solid var(--line);background:#000;color:#fff;font:600 20px Manrope,sans-serif;text-align:center;letter-spacing:.12em;text-transform:uppercase;outline:none}
input:focus{border-color:var(--silver)}
button{height:54px;border:0;border-radius:99px;background:var(--red);color:#fff;font:700 17px Manrope,sans-serif;cursor:pointer}
button:disabled{opacity:.6}
#msg{min-height:48px;margin-top:16px;font-weight:700}
.err{color:var(--red)}.ok{color:var(--ok)}
.shake{animation:sh .4s}@keyframes sh{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
small{display:block;margin-top:28px;color:#6d676a;font-size:13px}
</style>
</head>
<body>
<main class="box">
  <div class="seal" aria-hidden="true">X</div>
  <p class="file">OPERATION: X · защищённый терминал</p>
  <h1>Введите код доступа</h1>
  <p class="sub">У некоторых агентов только половина кода. Найдите напарницу и введите код целиком.</p>
  <form id="f" autocomplete="off">
    <input id="code" aria-label="Код доступа" placeholder="КОД" autocapitalize="characters" spellcheck="false" required>
    <button id="go" type="submit">Войти</button>
  </form>
  <div id="msg" role="status"></div>
  <small>Все попытки входа фиксируются Master Controller. Почти.</small>
</main>
<script>
{
const f=document.getElementById('f'),inp=document.getElementById('code'),msg=document.getElementById('msg'),btn=document.getElementById('go');
const norm=s=>s.toUpperCase().replace(/[^A-ZА-ЯЁ0-9]/g,'');
async function hash(s){const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('').slice(0,16)}
f.addEventListener('submit',async e=>{
  e.preventDefault();const c=norm(inp.value);if(!c)return;
  btn.disabled=true;msg.className='';msg.textContent='Проверка…';
  try{
    const h=await hash(c);const url='./'+h+'/';
    const r=await fetch(url,{method:'GET',cache:'no-store'});
    if(r.ok){msg.className='ok';msg.textContent='Доступ разрешён';setTimeout(()=>location.href=url,700);return}
  }catch(_){}
  msg.className='err';msg.textContent='Доступ запрещён. Проверьте код у напарницы.';
  f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');btn.disabled=false;
});
}
</script>
</body>
</html>
